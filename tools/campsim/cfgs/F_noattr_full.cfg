// FF5.5.4 Configuration file 10/07/2010
//=================Campaigns========================
set g_nPercentage_available_aircraft 40
//The 'minimum available aircraft' setting allows you to limit the effect of a low
//'percentage' setting.  This setting applies a lower-limit to the number of available
//aircraft calculated from your 'percentage'.  You can set the 'percentage' to 0%,
//but if you also set your 'minimum' to 2, you will get two aircraft available per
//planning phase - at least, until the point you only have one aircraft left in the
//squadron.
set g_nMinimum_available_aircraft 4
// Allows for campaign to generate > 4 ship strike packages
set g_bLargeStrike 1
//Removes a 10% chance of package loss due to a debug mode
set g_bF4CommsKillPL 1
// Enables scramble missions.
set g_bScramble 1
// Disable Court Martials from Crashes and Ejections.
set g_bDisableCrashEjectCourtMartials 1
//Allow bullseyes to be automatically selected
set g_bFloatingBullseye 1
// Power stations affect fuel/supply generation.
set g_bPowerGrid 1
// Resupply squadron stores of aborted flights
set g_bLoadoutSquadStoreResupply 1
// Enables the campaign engine to subtract destroyed vehicles and aircraft along with any 
// munitions carried from the unit totals when destroyed.
set g_bRealisticAttrition 0
// Relocate helicopter squads faster
set g_bHelosReloc 1
// Allow SAMs to fire fire while on the move
set g_bFireOntheMove 1
// Player does not have to fly a campaign for X number of hours before it will affect the campaign
set g_nNoPlayerPlay 400
// Number of seconds to get from one taxi Point to the next.  Used to calculate Taxi start time
set g_nAdjustTaxiTime 20
// Try to control unnecessary campaign autosaves. (Use = 1)
set g_bAutoSaveNow 0
//=================End Campaigns==============
//================ Misc. =====================
// Select any tasking order for any waypoint, regardless of mission
set g_bAnyWaypointTask 1
// Fixes grid snapping.
set g_bPrecisionWaypoints 0
// Shows target Lat/Long in Recon.
set g_bReconLatLong 1
// Enable the AWACS extensions on the planning screens.
set g_bAWACSSupport 1
// This option switches the UI background map to an AWACS version
set g_bAWACSBackground 0
//Generates Briefings using HTML tags.
set g_bBriefHTML 0
// Select if briefing shall be printed or written to file (while choosing to append or overwrite briefing.txt)
set g_nPrintToFile 1
set g_bAppendToBriefingFile 0
// This turns on text-logging of debriefings
set g_bLogEvents 0
// Don't record AAA shots at the player to event list
set g_bNoAAAEventRecords 1
// Set the near label limit (NM) (default 20) (Recommend 5)
set g_nNearLabelLimit 5
// When turned on, labels also display distance in nm
set g_bLabelShowDistance 1
set g_nNumberOfSubTitles 5
set g_nSubTitleTTL 5000
//Turns off the ACMI RECORDING msg
set g_bACMIRecordMsgOff 0
// Ramp Start minutes before taxi time - Externalized for player choice
set g_nRampStartMinutes 20
//================ end Misc. =====================
//================ MultiPlayer =====================
// This option puts Falcon into Multiplayer Server mode. A server mode session can't enter the 3D world.
set g_bServer 0
// With this option the Falcon Multiplayer Server will host all units except the client's own aircraft. 
// The server has the full CPU load of all aggregated and deaggregated units and the network traffic they afford. 
// This option is designed to be useful for a high bandwidth with fast CPU server and many players with low bandwidth connections. 
// WARNING: This option has not yet been fully tested and should be handled with care. Use at your own risk.
set g_bServerHostAll 0
//===============end MultiPlayer=====================
//================ TrackIR =====================
// Enables 3d Cockpit TrackIR
set g_bEnableTrackIR 1
// 0 = TIR Yaw, Pitch and Roll  1 = TIR Yaw, Pitch, Roll, X, Y Z  2 = TIR Yaw, Pitch, Roll and FOV zoom
set g_n6DOFTIR 1
// Enables TrackIR for the 2d cockpit. Only works if 3d cockpit support is enabled
set g_bTrackIR2DCockpit 0
// Determines how fast the 2d cockpit screens are switched
set g_nTrackIRSampleFreq 512
// configures the up/down zones for the TrackIR 2D mode
set g_fTIR2DPitchPercentage 0.5
// configures the left/right zones for the TrackIR 2D mode
set g_fTIR2DYawPercentage 0.5
// TIR minimum FOV angle (maximum forward move) 
set g_fTIRMinimumFOV 45
// TIR maximum FOV angle (maximum backward move) 
set g_fTIRMaximumFOV 100 
//================ end TrackIR =====================
//================ Cockpit =====================
// Cockpit Auto Scaling
set g_bCockpitAutoScale 1
set g_bAutoScaleFonts 1
// Start in 3D cockpit
set g_bStartIn3Dpit 0
// Set on to use new 3D cockpit with fully animated dials.
set g_bUseNew3dpit 0
// Enables the 3D clickable cockpit
set g_b3DClickableCockpit 1
// Enable animated pilot
set g_bAnimPilotHead 1
// Interval (minutes) to perform 1 of the 9 pilot animations 
set g_fPilotActInterval 0.5
// Show 3D cockpit cursor green when over clickable hotspot
set g_b3DClickableCursorChange 1
// 3D cockpit head tilt (-deg. = up).  Up/down view angle at entry into 3D pit.
set g_f3DHeadTilt 15.0
// Try to match view when switching from 2D to 3D and 3D to 2D cockpits
set g_bSync2D3DPit 1
// 3D cockpit panning (left/right) limits:  0 = +/-150  1 = +/-180  2 = +/-180 with wrap around
set g_n3DHeadPanRange 0
// 3D cockpit head tilting (up/down) limits:  0 = +140/-25  1 = +140/-40  2 = +140/-90  3 = +/-180  4 = +/-180 with wrap around
set g_n3DHeadTiltRange 1
// 3D clickable cockpit debug mode
set g_b3DClickableCockpitDebug 0
// Limit the maximum amount that the FOV can be increased
set g_fMaximumFOV 80
// Aeyes DED spacing fix for high resolutions
set g_bDEDSpacingFix 1
// Turns OFF the HUD AOA.
set g_bhudAOA 1
// Enables new HUD fixes - bent negative pitch ladder, extended horizon line, ghost horizon line and X'd out FPM and STPT boxes.
set g_bHudFix 1
// Sets the size of the bullseye to a smaller, more realistic size.
set g_bSmallerBullseye 0
// Allows the waypoint symbols on the HSD display to be scaled to more realistic sizes.
set g_fHSDSymbolSize 0.05
// Movement in response to G's and turns in 3D cockpit
set g_b3dDynamicPilotHead 1
// Enables the User to control WinAmp 2.xx from inside falcon
set g_bPilotEntertainment 0
// Sets the initial WimAmp 2.xx volume on entering falcon0
set g_nWinAmpInitVolume 204
// Determines the size of the padlock box (Numeric, default 2)
set g_nPadlockBoxSize 2
// New padlock with more realistic head movement.
set g_bNewPadlock 1
// PLockModeNormal 0x0
// PLockModeNearLabelColor 0x1
// PLockModeNoSnap 0x2
// PLockModeBreakLock 0x4
// PLockNoTrees 0x8
set g_nPadlockMode 15
// Padlock break distance
set g_fPadlockBreakDistance 8.0
// Your pilot's head will move around in response to g's and roll input in the 3d virtual cockpit.
set g_b3dDynamicPilotHead 1
// Full Screen NVG
set g_bFullScreenNVG 1
set g_fDefaultFOV 60
// Try 75 to 85 for Wide-screen monitors
set g_f3DPitFOV 60
// Try 75 to 85 for Wide-screen monitors for 3D pit
set g_bBrightHUD 1
//================ end Cockpit =====================
//================ Avionics =====================
//Enables realistic Maverick seeker head gyro spool up time of 3 minutes.
set g_bRealisticMavTime 0
//Enables cycling Nav steerpoint modes with the FCC submodes key.
set g_bEnableFCCSubNavCycle 1
// DBS1 and 2 scan rate factors
set g_fDBS1ScanRateFactor 0.75
set g_fDBS2ScanRateFactor 0.85
//Enables Bullseye cursor in Ground Radar modes.
set g_bEnableGRCursorBullseye 1
// Give all aircraft a IFF interrogator
set g_bAllHaveIFF 0
// Enables strafing mode to be selected through a/g weapon cycle for all aircraft.
set g_bUseDefinedGunDomain 1
// This turns on transparent and colored MFD (colored TGP/WPN cameras)
set g_bEnableMfdColors 1
// When designating inside the 40 nm distance in BORE, and slewing outside, the HUD designation box got stuck
set g_bMavFix2 1
// Color MFDs as per MLU (mid-life update)
set g_bEnableColorMfd 1
// Removes the RPM indication on your HUD, as in the real aircraft.
set g_bNoRPMOnHud 0
// Sets the aircraft configuration to CATIII upon entering the cockpit, regardless of your loadout.
set g_bCATIIIDefault 0
// Use Chevrons on the MFD to indicate jamming activity, rather than the large X.
set g_bRadarJamChevrons 1
// Draw MFD radar targets as square boxes rather than triangles. 
// This is the default for EPAF countries F-16 models.
set g_bEPAFRadarCues 1
// Radar Blips size 100% (default 1.0)
set g_fRadarScale 1.0
// Set the cursor speed. (default 1.0)
set g_fCursorSpeed 1.0
// MFD's in HUD only view can be turned off
set g_bNoMFDsIn1View 1
// Use different colours on colour MFD (helps colour blindness distinction).
set g_bMFDHighContrast 1
// INS
set g_bINS 1
//Use Greyscale for TGP and WPN MFD
set g_bGreyScaleMFD 1
// DBS1 cursor speed factor (default 75%)
set g_fDBS1factor 0.25
// DBS2 cursor speed factor (default 75%)
set g_fDBS2factor 0.05�
// Keep the radar sweep working while in Combat Autopilot
set g_bwoeir 1
//================ end Avionics =====================
//================ Sounds =====================
// Use 3D Sound
set g_bUse3dSound 1
// Revert to older sound system (polled interface) in case of problems.
set g_bOldSoundAlg 1
set g_nSoundSwitchFix 1
// How many milliseconds must elapse before the sound code updates.
set g_nSoundUpdateMS 10
//Low bandwidth voice - Uses 1.2 Kbps of bandwidth when using internal comms instead of 3.2 Kbps - Should help modem users.
set g_bLowBwVoice 0
//Maximum number of voices allocated by the sound code.
set g_nDynamicVoices 32
// Allows for removal of annoying takeoff.wav
set g_bTakeoffSound 0
// Enable Voice Communications
set g_bVoiceCom 0
//================ end Sounds =====================
//================ Graphics =====================
// Turns off that star displayed with the missile flame
set g_bDisableMissleEngGlow 1
// Use Higher-Res textures at higher altitudes (BMS default: 2 / Original MPS: 1)
set g_fTexDetailFactor 2
// Never let the fartiles kick in at high altitudes (default: 1)
set g_bDisableHighFartiles 1
// Display Sun Lens Flare (default: 1)
set g_bLensFlare 1
// Set the number which will represent FPS to level that you want new explosion effects to be turned off.  Depending on your system it may help FPS in some cases.
set g_nPSKillFPS 0
// Enable internal High activity special effects.  May cause a large decrease in FPS.
set g_bHighSFX 0 
// Some drivers try to cheat benchmarks programs by buffering frames ahead and queuing blits
// Leave this option enabled.  It should help with stuttering. (0 - disabled, 1 - enabled, default 1)
set g_bCheckBltStatusBeforeFlip 1
// Forces the Falcon User Interface to be rendered without hardware acceleration
// Cures UI stickyness on certain hardware (always turned on for 3DFX hardware)  
// (0 - disabled, 1 - enabled, default 0)
set g_bForceSoftwareGUI 1
// Enable new damage effects (0 - disabled, 1 - enabled, default 1)
set g_bNewDamageEffects 0
// Disable aircraft jittering when they are damaged (0 - disabled, 1 - enabled, default 0)
// Recommend 1
set g_bDisableFunkyChicken 1
// Set the minimum height clouds will appear.  (default -1.0)
set g_fCloudMinHeight -1.0
// Switches between 800x600 and 1024x768 UI size
set g_bHiResUI 1
// Turn on/off tree display
set g_bDisplayTrees 1
// This fixes graphics distortions of sun, sunglare, moon and explosions - mostly a problem for nVidia users
set g_nGfxFix 7
// Use (1) or eliminate need for (0) Lxxxxx.dds and Mxxxxx.dds tiles 
set g_bUseLandMtiles 0
// Labels show only first letter of the label name (1) or a "+" (2)
set g_bLabelBrief 0
// When turned on, labels also display distance in nm
set g_bLabelShowDistance 1
//================ end Graphics =====================
//================ Weather =====================
//This is variable uses the weather that was saved when the TE was made(including the training TE's).
set g_bUseTEWeather 0
// Trun off rain (1)
set g_bNoRain 1
// Turn thunder sound On/Off. 0 for Off, 1 for On.
set g_bHearThunder 0
// Use the TE mission's weather 
set g_bUseTEWeather 0
//================ end Weather =====================
//================ Weapons =====================
// Several missile fixes:
// 0x01	"Bomb missile" flag support -> do a ground/feature impact missile end instead of lethalradius detonation
// 0x02	Also check if range*range > lethalRadiusSqrd at "closestApprch" flag
// 0x04	Use ArmingDelay MissileEndMessage instead of MinTime if warhead is not armed (fixes missiles being able to apply proximity damage while warhead is unarmed)
// 0x08	Do Proximity damage to the missile's target if we didn't hit it directly (for example if missile lost seeker track and hits the dirt)
// 0x10	Don't do the change to "NotDone" in Missmain.cpp when we have "closestApprch" flag already set hope this finally fixes floating missiles on the ground...
// 0x20	bring missile to an end if missile sensor lost lock on target and we are outside 2 times of lethalrange to last known position
// 0x40	Change targetDZ when target lost by g_fTgtDZFactor
// 0x80	Use correct missile/bomb drop sound (+ flag 0x01)
// 0x100  Fix for JDAM - have always cloud LOS if weapon flag 0x400 is set
set g_nMissileFix 511
// This allows Falcon to use the new rack data
set g_bNewRackData 1
// Enable the fixed rack loading code
set g_bSMSPylonLoadingFix 0
// A/C pitch adjustment (deg) to correct rocket hit location
set g_fRocketPitchFactor 3.0
//The roll inertia will now increase when you add stores to your aircraft. It is dynamic in that will account for fuel weight 
// in wing tanks and when you drop weapons.
set g_bRollInertia 1
// If set then winds will change direction and strength with altitude. This makes dumb bombs very 
// inaccurate from high level, but LGBs are unaffected.
set g_bEnableWindsAloft 0
// If turned on, player can override an overload of munition and still launch
set g_bAllowOverload 0
//================ end Weapons =====================
//================ Controls =====================
//Controls whether the rudder and NWS are linked to the roll input on the ground when you don't have a rudder control device.
set g_bRollLinkedNWSRudder 1
//Makes knob elevation control independent of mode and always followed for RWS/SAM and no-target TWS.
set g_bAntElevKnobFix 1
